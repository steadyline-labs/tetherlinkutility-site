# Tests and builds the site with Eleventy, then deploys _site/ to GitHub Pages.
#
# Runs on pushes to main, daily, or by hand. A manual run on another branch
# (gh workflow run deploy.yml --ref <branch>) only tests and builds; it never deploys.
# `-f update_snapshots=true` re-renders the visual baselines instead of comparing them; download
# them from the run's visual-snapshots artifact and commit them to tests/visual/.
name: Deploy site

on:
  push:
    branches: [main]
  # Daily rebuild so posts with a future `published` date go live on that day.
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Re-render visual test baselines (artifact visual-snapshots)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned, not ubuntu-latest: the visual baselines depend on the runner's fonts and Chrome build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the sitemap test compares lastmod with git commit dates.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # All tests, browser tests included (they use the runner's preinstalled Google Chrome).
      # A failing test fails this job, and the deploy job below never starts.
      - run: google-chrome --version
      - run: npm test
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots && '1' || '' }}
      # New baselines (update run) or the actual and diff images of a failed visual comparison.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: tests/visual/out/
          if-no-files-found: ignore
          retention-days: 14
      - run: npx @11ty/eleventy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    # Only main deploys. Any other branch (run by hand) only builds and tests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
