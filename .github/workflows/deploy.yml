# Builds the site with Eleventy and deploys _site/ to GitHub Pages.
#
# Inactive until go-live: this file only exists on the `eleventy` branch, and it only
# runs on pushes to `main` (or by hand). Before merging into main, switch
# Settings > Pages > Build and deployment > Source to "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  # Daily rebuild so posts with a future `published` date go live on that day.
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the sitemap test compares lastmod with git commit dates.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A failing test stops the deploy. Browser tests (*.browser.test.mjs) need a local Chrome
      # and run with `npm test` on the developer machine.
      - run: npm run test:ci
      - run: npx @11ty/eleventy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
