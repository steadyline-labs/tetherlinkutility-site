# Tests and builds the site with Eleventy, then deploys _site/ to GitHub Pages.
#
# Runs on pushes to main, daily, or by hand. A manual run on another branch
# (gh workflow run deploy.yml --ref <branch>) only tests and builds; it never deploys.
# Visual baselines live on the `visual-baselines` branch: copied into tests/visual/ before the tests,
# changed ones (new page text, or `-f update_snapshots=true` to re-render all) pushed back after a
# green run on main. sitemap.xml lastmod comes from git history at build time (tools/git-lastmod.mjs).
name: Deploy site

on:
  push:
    branches: [main]
  # Daily rebuild so posts with a future `published` date go live on that day.
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Re-render visual test baselines (artifact visual-snapshots)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # contents: write only to push changed visual baselines to the visual-baselines branch.
    permissions:
      contents: write
    # Pinned, not ubuntu-latest: the visual baselines depend on the runner's fonts and Chrome build.
    runs-on: ubuntu-24.04
    # A normal run takes about a minute; a hung browser test must not hold the pages queue for 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: sitemap lastmod is taken from git commit dates.
          fetch-depth: 0
      - name: Restore visual baselines
        run: |
          git fetch --no-tags origin +visual-baselines:refs/remotes/origin/visual-baselines
          git checkout origin/visual-baselines -- tests/visual
          git reset -q -- tests/visual
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # All tests, browser tests included (they use the runner's preinstalled Google Chrome).
      # A failing test fails this job, and the deploy job below never starts.
      - run: google-chrome --version
      - run: npm test
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots && '1' || '' }}
      # Baselines that changed in this run (new page text, first render, or update_snapshots) are
      # kept on the visual-baselines branch. Runs are serialized (concurrency: pages), so no push race.
      - name: Save visual baselines
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          dst="$RUNNER_TEMP/visual-baselines"
          git worktree add --detach "$dst" origin/visual-baselines
          cp tests/visual/*.png tests/visual/hashes.json "$dst/tests/visual/"
          cd "$dst"
          git add tests/visual
          if git diff --cached --quiet; then echo "visual baselines unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Visual baselines for ${GITHUB_SHA::7}"
          git push origin HEAD:refs/heads/visual-baselines
      # New baselines, previous renders of changed pages, or the actual and diff images of a failed comparison.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-snapshots
          path: tests/visual/out/
          if-no-files-found: ignore
          retention-days: 14
      - run: npx @11ty/eleventy
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # Only main deploys. Any other branch (run by hand) only builds and tests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
