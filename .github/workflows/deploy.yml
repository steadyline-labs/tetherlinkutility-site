# Tests and builds the site with Eleventy, then deploys _site/ to GitHub Pages.
#
# Runs on pushes to main, daily, or by hand. A manual run on another branch
# (gh workflow run deploy.yml --ref <branch>) only tests and builds; it never deploys.
name: Deploy site

on:
  push:
    branches: [main]
  # Daily rebuild so posts with a future `published` date go live on that day.
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the sitemap test compares lastmod with git commit dates.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # All tests, browser tests included (they use the runner's preinstalled Google Chrome).
      # A failing test fails this job, and the deploy job below never starts.
      - run: google-chrome --version
      - run: npm test
      - run: npx @11ty/eleventy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    # Only main deploys. Any other branch (run by hand) only builds and tests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
